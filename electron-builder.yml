appId: com.avride.app
productName: AVR IDE
copyright: AVR IDE
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/arduino-cli.exe
    to: arduino-cli.exe
  - from: licenses
    to: licenses
  # Пакеты ядер AVR и ESP8266 (npm run build:cores): IDE ставит их без интернета. ESP32 (≈1,9 ГБ) в установщик не входит —
  # лимит NSIS 2 ГБ на файл; он поставляется отдельным пакетом release/AVR-IDE-core-esp32-<версия>
  - from: build/cores-bundle
    to: cores
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
portable:
  artifactName: ${productName}-${version}-portable.${ext}
