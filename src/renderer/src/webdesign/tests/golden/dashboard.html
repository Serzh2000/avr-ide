<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>IoT-узел</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="wd-has-tools">
<div class="wd-tools"><div class="wd-status" data-state="connecting" id="wd-status" role="status"><i></i><span>Подключение…</span></div><button type="button" class="wd-tbtn" id="wd-theme-toggle" aria-label="Сменить тему"><svg class="wd-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button></div>
<main>
<section class="wd-section b-hd" id="b_hd"><div class="wd-inner"><div class="wd-flex b-hd_r" id="b_hd_r"><h2 class="wd-heading b-hd_h" id="b_hd_h"><span data-r="v">IoT-узел</span></h2><div class="wd-flex b-hd_b" id="b_hd_b"><span class="wd-badge soft b-bd_st" id="b_bd_st"><span data-r="v">Статус</span></span><div class="wd-clock b-clk" id="b_clk"><div class="wd-clock-t" data-r="t">--:--</div><div class="wd-label" data-r="d"></div></div></div></div></div></section>
<section class="wd-section b-tiles" id="b_tiles"><div class="wd-inner"><div class="wd-grid b-tl" id="b_tl"><div class="wd-card b-t_t_c" id="b_t_t_c"><div class="wd-sensor b-t_t" id="b_t_t"><svg class="wd-icon" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/></svg><div><div class="wd-label">Температура</div><div class="wd-sensor-val"><span data-r="v">--</span><span class="wd-unit">°C</span></div></div></div></div><div class="wd-card b-t_h_c" id="b_t_h_c"><div class="wd-sensor b-t_h" id="b_t_h"><svg class="wd-icon" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg><div><div class="wd-label">Влажность</div><div class="wd-sensor-val"><span data-r="v">--</span><span class="wd-unit">%</span></div></div></div></div><div class="wd-card b-t_p_c" id="b_t_p_c"><div class="wd-sensor b-t_p" id="b_t_p"><svg class="wd-icon" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/></svg><div><div class="wd-label">Давление</div><div class="wd-sensor-val"><span data-r="v">--</span><span class="wd-unit">гПа</span></div></div></div></div><div class="wd-card b-t_l_c" id="b_t_l_c"><div class="wd-sensor b-t_l" id="b_t_l"><svg class="wd-icon" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><div><div class="wd-label">Свет</div><div class="wd-sensor-val"><span data-r="v">--</span><span class="wd-unit">лк</span></div></div></div></div></div><div class="wd-grid b-mid" id="b_mid"><div class="wd-card b-c_ch1" id="b_c_ch1"><div class="wd-card-title">Температура</div><div class="wd-field b-ch1" id="b_ch1"><div class="wd-field-head"><span></span><output data-r="v">--</output></div><canvas class="wd-chart" data-r="c" role="img" aria-label=""></canvas></div></div><div class="wd-card b-c_g" id="b_c_g"><div class="wd-card-title">Питание</div><div class="wd-gauge b-g_v" id="b_g_v"><svg viewBox="0 0 120 80" role="img" aria-label="Батарея"><path class="wd-g-bg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><path class="wd-g-fg" data-r="fg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><text class="wd-g-text" data-r="v" x="60" y="62" text-anchor="middle">--</text></svg><div class="wd-label">Батарея</div></div><div class="wd-field b-pr_h" id="b_pr_h"><div class="wd-field-head"><span>Память (свободно)</span><output data-r="v">--</output></div><div class="wd-progress" role="progressbar" aria-valuemin="0" aria-valuemax="320" aria-valuenow="0" data-r="pb"><div class="wd-progress-bar" data-r="bar"></div></div></div></div></div><div class="wd-grid b-bot" id="b_bot"><div class="wd-card b-c_ch2" id="b_c_ch2"><div class="wd-card-title">Влажность</div><div class="wd-field b-ch2" id="b_ch2"><div class="wd-field-head"><span></span><output data-r="v">--</output></div><canvas class="wd-chart" data-r="c" role="img" aria-label=""></canvas></div></div><div class="wd-card b-c_ev" id="b_c_ev"><div class="wd-card-title">События</div><div class="wd-field b-lg" id="b_lg"><div class="wd-field-head"><span></span><button type="button" class="wd-clr" data-r="clr">Очистить</button></div><pre class="wd-log" data-r="l" role="log" aria-live="off"></pre></div></div></div><div class="wd-card b-c_tb" id="b_c_tb"><div class="wd-card-title">Система</div><div class="wd-tablewrap b-tbl" id="b_tbl"><table class="wd-table"><thead><tr><th>Параметр</th><th>Значение</th></tr></thead><tbody><tr><td>Сигнал WiFi</td><td data-c="1-1">-- дБм</td></tr><tr><td>Свободная память</td><td data-c="2-1">-- КБ</td></tr><tr><td>Аптайм</td><td data-c="3-1">-- с</td></tr></tbody></table></div></div></div></section>
</main>
<script src="app.js"></script>
</body>
</html>
