<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Метеостанция</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wd-tools"><div class="wd-status" data-state="connecting" id="wd-status" role="status"><i></i><span>Подключение…</span></div><button type="button" class="wd-tbtn" id="wd-theme-toggle" aria-label="Сменить тему"><svg class="wd-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button></div>
<main>
<section class="wd-section b-hero" id="b_hero"><div class="wd-inner"><h1 class="wd-heading b-hero_h" id="b_hero_h"><span data-r="v">Метеостанция</span></h1><p class="wd-text b-hero_t" id="b_hero_t"><span data-r="v">Данные датчиков в реальном времени</span></p></div></section>
<section class="wd-section b-now" id="b_now"><div class="wd-inner"><div class="wd-grid b-g" id="b_g"><div class="wd-card b-g_t_c" id="b_g_t_c"><div class="wd-gauge b-g_t" id="b_g_t"><svg viewBox="0 0 120 80" role="img" aria-label="Температура"><path class="wd-g-bg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><path class="wd-g-fg" data-r="fg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><text class="wd-g-text" data-r="v" x="60" y="62" text-anchor="middle">--</text></svg><div class="wd-label">Температура</div></div></div><div class="wd-card b-g_h_c" id="b_g_h_c"><div class="wd-gauge b-g_h" id="b_g_h"><svg viewBox="0 0 120 80" role="img" aria-label="Влажность"><path class="wd-g-bg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><path class="wd-g-fg" data-r="fg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><text class="wd-g-text" data-r="v" x="60" y="62" text-anchor="middle">--</text></svg><div class="wd-label">Влажность</div></div></div><div class="wd-card b-c_p" id="b_c_p"><div class="wd-sensor b-s_p" id="b_s_p"><svg class="wd-icon" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/></svg><div><div class="wd-label">Давление</div><div class="wd-sensor-val"><span data-r="v">--</span><span class="wd-unit">гПа</span></div></div></div><hr class="wd-divider b-d1" id="b_d1"><div class="wd-sensor b-s_l" id="b_s_l"><svg class="wd-icon" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><div><div class="wd-label">Освещённость</div><div class="wd-sensor-val"><span data-r="v">--</span><span class="wd-unit">лк</span></div></div></div></div></div><div class="wd-card b-c_chart" id="b_c_chart"><div class="wd-card-title">Температура за последнюю минуту</div><div class="wd-field b-ch" id="b_ch"><div class="wd-field-head"><span>Температура</span><output data-r="v">--</output></div><canvas class="wd-chart" data-r="c" role="img" aria-label="Температура"></canvas></div></div><div class="wd-card b-c_rain" id="b_c_rain"><div class="wd-indicator b-rain_i" id="b_rain_i" data-on="0"><span class="wd-dot"></span><span>Дождь</span><span class="wd-muted" data-r="t">нет</span></div></div></div></section>
</main>
<script src="app.js"></script>
</body>
</html>
