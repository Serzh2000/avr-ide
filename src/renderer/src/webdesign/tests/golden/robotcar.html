<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Робот-машинка</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="wd-has-tools">
<div class="wd-tools"><div class="wd-status" data-state="connecting" id="wd-status" role="status"><i></i><span>Подключение…</span></div><button type="button" class="wd-tbtn" id="wd-theme-toggle" aria-label="Сменить тему"><svg class="wd-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button></div>
<main>
<section class="wd-section b-hero" id="b_hero"><div class="wd-inner"><h1 class="wd-heading b-hero_h" id="b_hero_h"><span data-r="v">Робот-машинка</span></h1><p class="wd-text b-hero_t" id="b_hero_t"><span data-r="v">Джойстик, фары, сигнал и датчики препятствий</span></p></div></section>
<section class="wd-section b-main" id="b_main"><div class="wd-inner"><div class="wd-flex b-st" id="b_st"><span class="wd-badge soft b-bd_mode" id="b_bd_mode"><span data-r="v">Режим</span></span><div class="wd-indicator b-in_obs" id="b_in_obs" data-on="0"><span class="wd-dot"></span><span>Препятствие</span><span class="wd-muted" data-r="t">нет</span></div></div><div class="wd-card b-c_pad" id="b_c_pad"><div class="wd-card-title">Управление</div><div class="wd-grid b-pads" id="b_pads"><div class="wd-field b-pad_stick" id="b_pad_stick"><span class="wd-label">Джойстик</span><div class="wd-joy" data-r="j" role="application" aria-label="Джойстик"><div class="wd-joy-knob" data-r="k"></div></div></div><div class="wd-field b-pad_dir" id="b_pad_dir"><span class="wd-label">Крестовина</span><div class="wd-pad"><button type="button" class="wd-pb" data-d="up" aria-label="Вверх" style="grid-area:1/2">▲</button><button type="button" class="wd-pb" data-d="left" aria-label="Влево" style="grid-area:2/1">◀</button><button type="button" class="wd-pb" data-d="center" aria-label="Стоп" style="grid-area:2/2">●</button><button type="button" class="wd-pb" data-d="right" aria-label="Вправо" style="grid-area:2/3">▶</button><button type="button" class="wd-pb" data-d="down" aria-label="Вниз" style="grid-area:3/2">▼</button></div></div></div><label class="wd-field b-sl_sp" id="b_sl_sp"><span class="wd-field-head"><span>Скорость</span><output data-r="v"></output></span><input class="wd-range" data-r="i" type="range" min="0" max="100" step="5" value="0"></label></div><div class="wd-grid b-g2" id="b_g2"><div class="wd-card b-c_fx" id="b_c_fx"><div class="wd-card-title">Свет и звук</div><label class="wd-switch b-sw_head" id="b_sw_head"><input type="checkbox" role="switch" data-r="i"><span class="wd-track"></span><span>Фары</span></label><button type="button" class="wd-btn b-b_horn" id="b_b_horn">Сигнал</button><label class="wd-field b-sel_mode" id="b_sel_mode"><span class="wd-label">Режим езды</span><select class="wd-input" data-r="i"><option value="manual">Ручной</option><option value="line">По линии</option><option value="avoid">Объезд препятствий</option></select></label></div><div class="wd-card b-c_sens" id="b_c_sens"><div class="wd-card-title">Датчики</div><div class="wd-field b-pr_b" id="b_pr_b"><div class="wd-field-head"><span>Аккумулятор</span><output data-r="v">--</output></div><div class="wd-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-r="pb"><div class="wd-progress-bar" data-r="bar"></div></div></div><div class="wd-sensor b-s_d" id="b_s_d"><svg class="wd-icon" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14l4-4M3.5 18a9.5 9.5 0 1 1 17 0"/></svg><div><div class="wd-label">До препятствия</div><div class="wd-sensor-val"><span data-r="v">--</span><span class="wd-unit">см</span></div></div></div></div></div><div class="wd-card b-c_log" id="b_c_log"><div class="wd-field b-lg" id="b_lg"><div class="wd-field-head"><span>Бортовой журнал</span><button type="button" class="wd-clr" data-r="clr">Очистить</button></div><pre class="wd-log" data-r="l" role="log" aria-live="off"></pre></div></div></div></section>
</main>
<script src="app.js"></script>
</body>
</html>
