<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Аквариум</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="wd-has-tools">
<div class="wd-tools"><div class="wd-status" data-state="connecting" id="wd-status" role="status"><i></i><span>Подключение…</span></div><button type="button" class="wd-tbtn" id="wd-theme-toggle" aria-label="Сменить тему"><svg class="wd-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button></div>
<main>
<section class="wd-section b-hero" id="b_hero"><div class="wd-inner"><h1 class="wd-heading b-hero_h" id="b_hero_h"><span data-r="v">Аквариум</span></h1><p class="wd-text b-hero_t" id="b_hero_t"><span data-r="v">Температура, pH, свет и кормление</span></p></div></section>
<section class="wd-section b-main" id="b_main"><div class="wd-inner"><div class="wd-grid b-top" id="b_top"><div class="wd-card b-g_t_c" id="b_g_t_c"><div class="wd-gauge b-g_t" id="b_g_t"><svg viewBox="0 0 120 80" role="img" aria-label="Вода"><path class="wd-g-bg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><path class="wd-g-fg" data-r="fg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><text class="wd-g-text" data-r="v" x="60" y="62" text-anchor="middle">--</text></svg><div class="wd-label">Вода</div></div></div><div class="wd-card b-g_ph_c" id="b_g_ph_c"><div class="wd-gauge b-g_ph" id="b_g_ph"><svg viewBox="0 0 120 80" role="img" aria-label="pH"><path class="wd-g-bg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><path class="wd-g-fg" data-r="fg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><text class="wd-g-text" data-r="v" x="60" y="62" text-anchor="middle">--</text></svg><div class="wd-label">pH</div></div></div><div class="wd-card b-c_lv" id="b_c_lv"><div class="wd-field b-pr_lv" id="b_pr_lv"><div class="wd-field-head"><span>Уровень воды</span><output data-r="v">--</output></div><div class="wd-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-r="pb"><div class="wd-progress-bar" data-r="bar"></div></div></div><div class="wd-sensor b-s_tds" id="b_s_tds"><svg class="wd-icon" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg><div><div class="wd-label">Жёсткость TDS</div><div class="wd-sensor-val"><span data-r="v">--</span><span class="wd-unit">ppm</span></div></div></div><div class="wd-indicator b-in_h" id="b_in_h" data-on="0"><span class="wd-dot"></span><span>Нагреватель</span><span class="wd-muted" data-r="t">ожидание</span></div></div></div><div class="wd-grid b-g2" id="b_g2"><div class="wd-card b-c_dev" id="b_c_dev"><div class="wd-card-title">Оборудование</div><label class="wd-switch b-sw_l" id="b_sw_l"><input type="checkbox" role="switch" data-r="i"><span class="wd-track"></span><span>Освещение</span></label><label class="wd-switch b-sw_f" id="b_sw_f"><input type="checkbox" role="switch" data-r="i"><span class="wd-track"></span><span>Фильтр</span></label><label class="wd-switch b-sw_a" id="b_sw_a"><input type="checkbox" role="switch" data-r="i"><span class="wd-track"></span><span>Аэратор</span></label><label class="wd-switch b-sw_h" id="b_sw_h"><input type="checkbox" role="switch" data-r="i"><span class="wd-track"></span><span>Обогрев вручную</span></label></div><div class="wd-card b-c_feed" id="b_c_feed"><div class="wd-card-title">Кормление и свет</div><div class="wd-flex b-fr" id="b_fr"><button type="button" class="wd-btn b-b_feed" id="b_b_feed">Покормить рыб</button><div class="wd-sensor b-s_fed" id="b_s_fed"><svg class="wd-icon" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg><div><div class="wd-label">Сегодня кормили</div><div class="wd-sensor-val"><span data-r="v">--</span><span class="wd-unit">раз</span></div></div></div></div><label class="wd-field b-sel_l" id="b_sel_l"><span class="wd-label">Программа света</span><select class="wd-input" data-r="i"><option value="day">День 10:00–20:00</option><option value="long">Длинный день</option><option value="moon">Лунный режим</option></select></label></div></div><div class="wd-card b-c_ch" id="b_c_ch"><div class="wd-field b-ch" id="b_ch"><div class="wd-field-head"><span>Температура воды</span><output data-r="v">--</output></div><canvas class="wd-chart" data-r="c" role="img" aria-label="Температура воды"></canvas></div></div></div></section>
</main>
<script src="app.js"></script>
</body>
</html>
