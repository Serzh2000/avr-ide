<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Освещение</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="wd-has-tools">
<div class="wd-tools"><div class="wd-status" data-state="connecting" id="wd-status" role="status"><i></i><span>Подключение…</span></div><button type="button" class="wd-tbtn" id="wd-theme-toggle" aria-label="Сменить тему"><svg class="wd-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button></div>
<main>
<section class="wd-section b-hero" id="b_hero"><div class="wd-inner"><h1 class="wd-heading b-hero_h" id="b_hero_h"><span data-r="v">Освещение</span></h1><p class="wd-text b-hero_t" id="b_hero_t"><span data-r="v">Яркость по комнатам, сцены и цветовая температура</span></p></div></section>
<section class="wd-section b-scenes" id="b_scenes"><div class="wd-inner"><div class="wd-flex b-sc_row" id="b_sc_row"><button type="button" class="wd-btn b-sc_m" id="b_sc_m">Утро</button><button type="button" class="wd-btn b-sc_d" id="b_sc_d">День</button><button type="button" class="wd-btn b-sc_e" id="b_sc_e">Вечер</button><button type="button" class="wd-btn b-sc_n" id="b_sc_n">Кино</button></div></div></section>
<section class="wd-section b-rooms" id="b_rooms"><div class="wd-inner"><div class="wd-grid b-rg" id="b_rg"><div class="wd-card b-room1" id="b_room1"><div class="wd-card-title">Гостиная</div><svg id="b_room1_ic" class="wd-icon b-room1_ic" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg><label class="wd-field b-room1_sl" id="b_room1_sl"><span class="wd-field-head"><span>Яркость</span><output data-r="v"></output></span><input class="wd-range" data-r="i" type="range" min="0" max="255" step="1" value="0"></label></div><div class="wd-card b-room2" id="b_room2"><div class="wd-card-title">Спальня</div><svg id="b_room2_ic" class="wd-icon b-room2_ic" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg><label class="wd-field b-room2_sl" id="b_room2_sl"><span class="wd-field-head"><span>Яркость</span><output data-r="v"></output></span><input class="wd-range" data-r="i" type="range" min="0" max="255" step="1" value="0"></label></div><div class="wd-card b-room3" id="b_room3"><div class="wd-card-title">Кухня</div><svg id="b_room3_ic" class="wd-icon b-room3_ic" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><label class="wd-field b-room3_sl" id="b_room3_sl"><span class="wd-field-head"><span>Яркость</span><output data-r="v"></output></span><input class="wd-range" data-r="i" type="range" min="0" max="255" step="1" value="0"></label></div></div><div class="wd-grid b-rg2" id="b_rg2"><div class="wd-card b-c_cct" id="b_c_cct"><div class="wd-card-title">Оттенок</div><fieldset class="wd-field wd-radio b-rd_cct" id="b_rd_cct" data-r="i"><legend class="wd-label">Цветовая температура</legend><label class="wd-opt"><input type="radio" name="r_rd_cct" value="warm"><span>Тёплый 2700K</span></label><label class="wd-opt"><input type="radio" name="r_rd_cct" value="neutral"><span>Нейтральный 4000K</span></label><label class="wd-opt"><input type="radio" name="r_rd_cct" value="cold"><span>Холодный 6500K</span></label></fieldset><label class="wd-field b-col" id="b_col"><span class="wd-label">Цвет акцентной лампы</span><input class="wd-color" data-r="i" type="color" value="#4f6df5"></label></div><div class="wd-card b-c_night" id="b_c_night"><div class="wd-card-title">Режим</div><label class="wd-switch b-sw_night" id="b_sw_night"><input type="checkbox" role="switch" data-r="i"><span class="wd-track"></span><span>Ночной режим</span></label><label class="wd-switch b-sw_hall" id="b_sw_hall"><input type="checkbox" role="switch" data-r="i"><span class="wd-track"></span><span>Прихожая (реле)</span></label><div class="wd-clock b-clk" id="b_clk"><div class="wd-label">Время</div><div class="wd-clock-t" data-r="t">--:--</div><div class="wd-label" data-r="d"></div></div></div></div></div></section>
</main>
<script src="app.js"></script>
</body>
</html>
