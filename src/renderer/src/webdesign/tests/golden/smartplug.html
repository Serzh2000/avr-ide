<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Умные розетки</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="wd-has-tools">
<div class="wd-tools"><div class="wd-status" data-state="connecting" id="wd-status" role="status"><i></i><span>Подключение…</span></div><button type="button" class="wd-tbtn" id="wd-theme-toggle" aria-label="Сменить тему"><svg class="wd-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button></div>
<main>
<section class="wd-section b-hero" id="b_hero"><div class="wd-inner"><h1 class="wd-heading b-hero_h" id="b_hero_h"><span data-r="v">Умные розетки</span></h1><p class="wd-text b-hero_t" id="b_hero_t"><span data-r="v">Включайте технику, считайте мощность и ставьте таймер</span></p></div></section>
<section class="wd-section b-main" id="b_main"><div class="wd-inner"><div class="wd-grid b-sg" id="b_sg"><div class="wd-card b-sock1" id="b_sock1"><div class="wd-card-title">Розетка 1 — обогреватель</div><div class="wd-flex b-sock1_r" id="b_sock1_r"><svg id="b_sock1_ic" class="wd-icon b-sock1_ic" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><label class="wd-switch b-sock1_sw" id="b_sock1_sw"><input type="checkbox" role="switch" data-r="i"><span class="wd-track"></span><span>Питание</span></label></div><div class="wd-gauge b-sock1_g" id="b_sock1_g"><svg viewBox="0 0 120 80" role="img" aria-label="Мощность"><path class="wd-g-bg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><path class="wd-g-fg" data-r="fg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><text class="wd-g-text" data-r="v" x="60" y="62" text-anchor="middle">--</text></svg><div class="wd-label">Мощность</div></div><label class="wd-field b-sock1_tm" id="b_sock1_tm"><span class="wd-label">Выключить через</span><select class="wd-input" data-r="i"><option value="off">Не выключать</option><option value="15">15 минут</option><option value="60">1 час</option><option value="240">4 часа</option></select></label></div><div class="wd-card b-sock2" id="b_sock2"><div class="wd-card-title">Розетка 2 — лампа</div><div class="wd-flex b-sock2_r" id="b_sock2_r"><svg id="b_sock2_ic" class="wd-icon b-sock2_ic" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg><label class="wd-switch b-sock2_sw" id="b_sock2_sw"><input type="checkbox" role="switch" data-r="i"><span class="wd-track"></span><span>Питание</span></label></div><div class="wd-gauge b-sock2_g" id="b_sock2_g"><svg viewBox="0 0 120 80" role="img" aria-label="Мощность"><path class="wd-g-bg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><path class="wd-g-fg" data-r="fg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><text class="wd-g-text" data-r="v" x="60" y="62" text-anchor="middle">--</text></svg><div class="wd-label">Мощность</div></div><label class="wd-field b-sock2_tm" id="b_sock2_tm"><span class="wd-label">Выключить через</span><select class="wd-input" data-r="i"><option value="off">Не выключать</option><option value="15">15 минут</option><option value="60">1 час</option><option value="240">4 часа</option></select></label></div></div><div class="wd-grid b-sg2" id="b_sg2"><div class="wd-card b-c_prot" id="b_c_prot"><div class="wd-card-title">Защита</div><label class="wd-cb b-cb_prot" id="b_cb_prot"><input type="checkbox" data-r="i"><span>Отключать при перегрузке</span></label><div class="wd-indicator b-in_alarm" id="b_in_alarm" data-on="0"><span class="wd-dot"></span><span>Перегрузка</span><span class="wd-muted" data-r="t">норма</span></div></div><div class="wd-card b-c_en" id="b_c_en"><div class="wd-card-title">Потребление</div><div class="wd-sensor b-s_kwh" id="b_s_kwh"><svg class="wd-icon" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><div><div class="wd-label">Энергия за сутки</div><div class="wd-sensor-val"><span data-r="v">--</span><span class="wd-unit">кВт·ч</span></div></div></div><div class="wd-tablewrap b-tb_en" id="b_tb_en"><table class="wd-table"><thead><tr><th>Розетка</th><th>Мощность</th></tr></thead><tbody><tr><td>№1</td><td data-c="1-1">-- Вт</td></tr><tr><td>№2</td><td data-c="2-1">-- Вт</td></tr></tbody></table></div></div></div></div></section>
</main>
<script src="app.js"></script>
</body>
</html>
