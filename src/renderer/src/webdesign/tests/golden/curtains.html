<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Шторы и ворота</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="wd-has-tools">
<div class="wd-tools"><div class="wd-status" data-state="connecting" id="wd-status" role="status"><i></i><span>Подключение…</span></div><button type="button" class="wd-tbtn" id="wd-theme-toggle" aria-label="Сменить тему"><svg class="wd-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button></div>
<main>
<section class="wd-section b-hero" id="b_hero"><div class="wd-inner"><h1 class="wd-heading b-hero_h" id="b_hero_h"><span data-r="v">Шторы и ворота</span></h1><p class="wd-text b-hero_t" id="b_hero_t"><span data-r="v">Приводы с концевыми выключателями</span></p></div></section>
<section class="wd-section b-main" id="b_main"><div class="wd-inner"><div class="wd-grid b-g" id="b_g"><div class="wd-card b-c_cur" id="b_c_cur"><div class="wd-card-title">Шторы в гостиной</div><div class="wd-field b-pr_pos" id="b_pr_pos"><div class="wd-field-head"><span>Открыто</span><output data-r="v">--</output></div><div class="wd-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-r="pb"><div class="wd-progress-bar" data-r="bar"></div></div></div><label class="wd-field b-sl_pos" id="b_sl_pos"><span class="wd-field-head"><span>Положение</span><output data-r="v"></output></span><input class="wd-range" data-r="i" type="range" min="0" max="100" step="5" value="0"></label><div class="wd-flex b-cur_btns" id="b_cur_btns"><button type="button" class="wd-btn b-b_open" id="b_b_open">Открыть</button><button type="button" class="wd-btn b-b_close" id="b_b_close">Закрыть</button></div><div class="wd-flex b-cur_lim" id="b_cur_lim"><div class="wd-indicator b-in_lo" id="b_in_lo" data-on="0"><span class="wd-dot"></span><span>Концевик «открыто»</span><span class="wd-muted" data-r="t">—</span></div><div class="wd-indicator b-in_lc" id="b_in_lc" data-on="0"><span class="wd-dot"></span><span>Концевик «закрыто»</span><span class="wd-muted" data-r="t">—</span></div></div></div><div class="wd-card b-c_gate" id="b_c_gate"><div class="wd-card-title">Гаражные ворота</div><div class="wd-flex b-gate_st" id="b_gate_st"><svg id="b_gate_ic" class="wd-icon b-gate_ic" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4"/></svg><span class="wd-badge soft b-gate_bd" id="b_gate_bd"><span data-r="v">Ворота</span></span><div class="wd-indicator b-in_go" id="b_in_go" data-on="0"><span class="wd-dot"></span><span>Створка</span><span class="wd-muted" data-r="t">закрыта</span></div></div><div class="wd-flex b-gate_btns" id="b_gate_btns"><button type="button" class="wd-btn b-gb_o" id="b_gb_o">Открыть</button><button type="button" class="wd-btn b-gb_s" id="b_gb_s">Стоп</button><button type="button" class="wd-btn b-gb_c" id="b_gb_c">Закрыть</button></div><label class="wd-cb b-cb_ac" id="b_cb_ac"><input type="checkbox" data-r="i"><span>Закрывать автоматически</span></label><label class="wd-field b-in_am" id="b_in_am"><span class="wd-label">Через, минут</span><input class="wd-input" data-r="i" type="number"  step="1" inputmode="decimal"></label><div class="wd-field b-lg" id="b_lg"><div class="wd-field-head"><span>Журнал</span><button type="button" class="wd-clr" data-r="clr">Очистить</button></div><pre class="wd-log" data-r="l" role="log" aria-live="off"></pre></div></div></div></div></section>
</main>
<script src="app.js"></script>
</body>
</html>
