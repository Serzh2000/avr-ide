<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Умная теплица</title>
<meta name="description" content="Микроклимат, полив и досветка">
<link rel="stylesheet" href="style.css">
</head>
<body class="wd-has-tools">
<div class="wd-tools"><div class="wd-status" data-state="connecting" id="wd-status" role="status"><i></i><span>Подключение…</span></div><button type="button" class="wd-tbtn" id="wd-theme-toggle" aria-label="Сменить тему"><svg class="wd-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button></div>
<main>
<section class="wd-section b-hero" id="b_hero"><div class="wd-inner"><h1 class="wd-heading b-hero_h" id="b_hero_h"><span data-r="v">Умная теплица</span></h1><p class="wd-text b-hero_t" id="b_hero_t"><span data-r="v">Климат, полив и досветка под контролем</span></p></div></section>
<section class="wd-section b-now" id="b_now"><div class="wd-inner"><div class="wd-flex b-st" id="b_st"><span class="wd-badge soft b-bd_mode" id="b_bd_mode"><span data-r="v">Режим</span></span><span class="wd-badge b-bd_on" id="b_bd_on"><span data-r="v">Онлайн</span></span></div><div class="wd-grid b-g1" id="b_g1"><div class="wd-card b-g_t_c" id="b_g_t_c"><div class="wd-gauge b-g_t" id="b_g_t"><svg viewBox="0 0 120 80" role="img" aria-label="Воздух"><path class="wd-g-bg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><path class="wd-g-fg" data-r="fg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><text class="wd-g-text" data-r="v" x="60" y="62" text-anchor="middle">--</text></svg><div class="wd-label">Воздух</div></div></div><div class="wd-card b-g_h_c" id="b_g_h_c"><div class="wd-gauge b-g_h" id="b_g_h"><svg viewBox="0 0 120 80" role="img" aria-label="Влажность воздуха"><path class="wd-g-bg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><path class="wd-g-fg" data-r="fg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><text class="wd-g-text" data-r="v" x="60" y="62" text-anchor="middle">--</text></svg><div class="wd-label">Влажность воздуха</div></div></div><div class="wd-card b-c_soil" id="b_c_soil"><div class="wd-card-title">Почва</div><div class="wd-field b-pr_soil" id="b_pr_soil"><div class="wd-field-head"><span>Влажность почвы (АЦП)</span><output data-r="v">--</output></div><div class="wd-progress" role="progressbar" aria-valuemin="0" aria-valuemax="4095" aria-valuenow="0" data-r="pb"><div class="wd-progress-bar" data-r="bar"></div></div></div><hr class="wd-divider b-d1" id="b_d1"><div class="wd-sensor b-s_lux" id="b_s_lux"><svg class="wd-icon" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><div><div class="wd-label">Освещённость</div><div class="wd-sensor-val"><span data-r="v">--</span><span class="wd-unit">лк</span></div></div></div><div class="wd-sensor b-s_co2" id="b_s_co2"><svg class="wd-icon" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/></svg><div><div class="wd-label">CO₂</div><div class="wd-sensor-val"><span data-r="v">--</span><span class="wd-unit">ppm</span></div></div></div></div></div><div class="wd-grid b-g2" id="b_g2"><div class="wd-card b-c_ctl" id="b_c_ctl"><div class="wd-card-title">Управление</div><label class="wd-field b-sel_mode" id="b_sel_mode"><span class="wd-label">Режим</span><select class="wd-input" data-r="i"><option value="auto">Автоматический</option><option value="manual">Ручной</option><option value="night">Ночной</option></select></label><label class="wd-field b-sl_t" id="b_sl_t"><span class="wd-field-head"><span>Целевая температура</span><output data-r="v"></output></span><input class="wd-range" data-r="i" type="range" min="15" max="35" step="1" value="15"></label><hr class="wd-divider b-d2" id="b_d2"><label class="wd-switch b-sw_pump" id="b_sw_pump"><input type="checkbox" role="switch" data-r="i"><span class="wd-track"></span><span>Насос полива</span></label><label class="wd-switch b-sw_fan" id="b_sw_fan"><input type="checkbox" role="switch" data-r="i"><span class="wd-track"></span><span>Вентиляция</span></label><label class="wd-switch b-sw_light" id="b_sw_light"><input type="checkbox" role="switch" data-r="i"><span class="wd-track"></span><span>Досветка</span></label></div><div class="wd-card b-c_hist" id="b_c_hist"><div class="wd-card-title">Динамика</div><div class="wd-tabs b-tb" id="b_tb"><div class="wd-tablist" role="tablist"><button type="button" class="wd-tab" role="tab" data-r="t" data-i="0" aria-selected="true">Температура</button><button type="button" class="wd-tab" role="tab" data-r="t" data-i="1" aria-selected="false">CO₂</button><button type="button" class="wd-tab" role="tab" data-r="t" data-i="2" aria-selected="false">Журнал</button></div><div class="wd-panel b-tb_t" id="b_tb_t" role="tabpanel" data-i="0"><div class="wd-field b-ch_t" id="b_ch_t"><div class="wd-field-head"><span>Воздух</span><output data-r="v">--</output></div><canvas class="wd-chart" data-r="c" role="img" aria-label="Воздух"></canvas></div></div><div class="wd-panel b-tb_c" id="b_tb_c" role="tabpanel" data-i="1" hidden><div class="wd-field b-ch_c" id="b_ch_c"><div class="wd-field-head"><span>CO₂</span><output data-r="v">--</output></div><canvas class="wd-chart" data-r="c" role="img" aria-label="CO₂"></canvas></div></div><div class="wd-panel b-tb_l" id="b_tb_l" role="tabpanel" data-i="2" hidden><div class="wd-field b-lg" id="b_lg"><div class="wd-field-head"><span>События</span><button type="button" class="wd-clr" data-r="clr">Очистить</button></div><pre class="wd-log" data-r="l" role="log" aria-live="off"></pre></div></div></div></div></div></div></section>
</main>
<script src="app.js"></script>
</body>
</html>
