<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Монитор энергии</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="wd-has-tools">
<div class="wd-tools"><div class="wd-status" data-state="connecting" id="wd-status" role="status"><i></i><span>Подключение…</span></div><button type="button" class="wd-tbtn" id="wd-theme-toggle" aria-label="Сменить тему"><svg class="wd-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button></div>
<main>
<section class="wd-section b-hero" id="b_hero"><div class="wd-inner"><h1 class="wd-heading b-hero_h" id="b_hero_h"><span data-r="v">Монитор энергии</span></h1><p class="wd-text b-hero_t" id="b_hero_t"><span data-r="v">Напряжение, ток, мощность и расход в реальном времени</span></p></div></section>
<section class="wd-section b-main" id="b_main"><div class="wd-inner"><div class="wd-grid b-top" id="b_top"><div class="wd-card b-g_w_c" id="b_g_w_c"><div class="wd-gauge b-g_w" id="b_g_w"><svg viewBox="0 0 120 80" role="img" aria-label="Мощность"><path class="wd-g-bg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><path class="wd-g-fg" data-r="fg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><text class="wd-g-text" data-r="v" x="60" y="62" text-anchor="middle">--</text></svg><div class="wd-label">Мощность</div></div></div><div class="wd-card b-g_v_c" id="b_g_v_c"><div class="wd-gauge b-g_v" id="b_g_v"><svg viewBox="0 0 120 80" role="img" aria-label="Напряжение"><path class="wd-g-bg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><path class="wd-g-fg" data-r="fg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><text class="wd-g-text" data-r="v" x="60" y="62" text-anchor="middle">--</text></svg><div class="wd-label">Напряжение</div></div></div><div class="wd-card b-c_sm" id="b_c_sm"><div class="wd-sensor b-s_a" id="b_s_a"><svg class="wd-icon" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><div><div class="wd-label">Ток</div><div class="wd-sensor-val"><span data-r="v">--</span><span class="wd-unit">А</span></div></div></div><div class="wd-sensor b-s_f" id="b_s_f"><svg class="wd-icon" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14l4-4M3.5 18a9.5 9.5 0 1 1 17 0"/></svg><div><div class="wd-label">Частота</div><div class="wd-sensor-val"><span data-r="v">--</span><span class="wd-unit">Гц</span></div></div></div><div class="wd-sensor b-s_pf" id="b_s_pf"><svg class="wd-icon" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14l4-4M3.5 18a9.5 9.5 0 1 1 17 0"/></svg><div><div class="wd-label">cos φ</div><div class="wd-sensor-val"><span data-r="v">--</span></div></div></div></div></div><div class="wd-card b-c_tabs" id="b_c_tabs"><div class="wd-tabs b-tb" id="b_tb"><div class="wd-tablist" role="tablist"><button type="button" class="wd-tab" role="tab" data-r="t" data-i="0" aria-selected="true">Сейчас</button><button type="button" class="wd-tab" role="tab" data-r="t" data-i="1" aria-selected="false">Статистика</button><button type="button" class="wd-tab" role="tab" data-r="t" data-i="2" aria-selected="false">Настройки</button></div><div class="wd-panel b-tb_now" id="b_tb_now" role="tabpanel" data-i="0"><div class="wd-field b-ch_w" id="b_ch_w"><div class="wd-field-head"><span>Мощность</span><output data-r="v">--</output></div><canvas class="wd-chart" data-r="c" role="img" aria-label="Мощность"></canvas></div><div class="wd-field b-pr_lim" id="b_pr_lim"><div class="wd-field-head"><span>Лимит суток (кВт·ч)</span><output data-r="v">--</output></div><div class="wd-progress" role="progressbar" aria-valuemin="0" aria-valuemax="15" aria-valuenow="0" data-r="pb"><div class="wd-progress-bar" data-r="bar"></div></div></div></div><div class="wd-panel b-tb_stat" id="b_tb_stat" role="tabpanel" data-i="1" hidden><div class="wd-tablewrap b-tbl" id="b_tbl"><table class="wd-table"><thead><tr><th>Период</th><th>Расход</th></tr></thead><tbody><tr><td>Сегодня</td><td data-c="1-1">-- кВт·ч</td></tr><tr><td>Месяц</td><td data-c="2-1">-- кВт·ч</td></tr><tr><td>Аптайм</td><td data-c="3-1">-- с</td></tr></tbody></table></div><div class="wd-clock b-clk" id="b_clk"><div class="wd-label">Аптайм счётчика</div><div class="wd-clock-t" data-r="t">--:--</div><div class="wd-label" data-r="d"></div></div></div><div class="wd-panel b-tb_set" id="b_tb_set" role="tabpanel" data-i="2" hidden><label class="wd-field b-in_lim" id="b_in_lim"><span class="wd-label">Лимит в сутки, кВт·ч</span><input class="wd-input" data-r="i" type="number"  step="1" inputmode="decimal"></label><fieldset class="wd-field wd-radio b-rd_tar" id="b_rd_tar" data-r="i"><legend class="wd-label">Тариф</legend><label class="wd-opt"><input type="radio" name="r_rd_tar" value="day"><span>Однотарифный</span></label><label class="wd-opt"><input type="radio" name="r_rd_tar" value="night"><span>День/ночь</span></label></fieldset><label class="wd-cb b-cb_n" id="b_cb_n"><input type="checkbox" data-r="i"><span>Уведомлять о превышении</span></label><button type="button" class="wd-btn b-b_reset" id="b_b_reset">Сбросить счётчик</button></div></div></div></div></section>
</main>
<script src="app.js"></script>
</body>
</html>
