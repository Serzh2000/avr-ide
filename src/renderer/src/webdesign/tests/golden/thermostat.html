<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Термостат</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="wd-has-tools">
<div class="wd-tools"><div class="wd-status" data-state="connecting" id="wd-status" role="status"><i></i><span>Подключение…</span></div><button type="button" class="wd-tbtn" id="wd-theme-toggle" aria-label="Сменить тему"><svg class="wd-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button></div>
<main>
<section class="wd-section b-hero" id="b_hero"><div class="wd-inner"><h1 class="wd-heading b-hero_h" id="b_hero_h"><span data-r="v">Термостат</span></h1><p class="wd-text b-hero_t" id="b_hero_t"><span data-r="v">Поддерживаем комфортную температуру</span></p></div></section>
<section class="wd-section b-main" id="b_main"><div class="wd-inner"><div class="wd-grid b-g" id="b_g"><div class="wd-card b-c_now" id="b_c_now"><div class="wd-card-title">Сейчас</div><div class="wd-gauge b-g_t" id="b_g_t"><svg viewBox="0 0 120 80" role="img" aria-label="Температура"><path class="wd-g-bg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><path class="wd-g-fg" data-r="fg" pathLength="100" d="M10 65A50 50 0 0 1 110 65"/><text class="wd-g-text" data-r="v" x="60" y="62" text-anchor="middle">--</text></svg><div class="wd-label">Температура</div></div><div class="wd-flex b-now_r" id="b_now_r"><div class="wd-indicator b-in_heat" id="b_in_heat" data-on="0"><span class="wd-dot"></span><span>Нагрев</span><span class="wd-muted" data-r="t">выключен</span></div><div class="wd-sensor b-s_h" id="b_s_h"><svg class="wd-icon" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg><div><div class="wd-label">Влажность</div><div class="wd-sensor-val"><span data-r="v">--</span><span class="wd-unit">%</span></div></div></div></div></div><div class="wd-card b-c_set" id="b_c_set"><div class="wd-card-title">Уставка</div><label class="wd-field b-sl_tg" id="b_sl_tg"><span class="wd-field-head"><span>Желаемая температура</span><output data-r="v"></output></span><input class="wd-range" data-r="i" type="range" min="10" max="30" step="0.5" value="10"></label><fieldset class="wd-field wd-radio b-rd_m" id="b_rd_m" data-r="i"><legend class="wd-label">Режим</legend><label class="wd-opt"><input type="radio" name="r_rd_m" value="off"><span>Выключен</span></label><label class="wd-opt"><input type="radio" name="r_rd_m" value="auto"><span>Авто</span></label><label class="wd-opt"><input type="radio" name="r_rd_m" value="manual"><span>Ручной</span></label></fieldset><label class="wd-switch b-sw_rel" id="b_sw_rel"><input type="checkbox" role="switch" data-r="i"><span class="wd-track"></span><span>Реле котла (ручное)</span></label><label class="wd-field b-in_h" id="b_in_h"><span class="wd-label">Гистерезис, °C</span><input class="wd-input" data-r="i" type="number"  step="1" inputmode="decimal"></label></div></div><div class="wd-card b-c_tabs" id="b_c_tabs"><div class="wd-tabs b-tb" id="b_tb"><div class="wd-tablist" role="tablist"><button type="button" class="wd-tab" role="tab" data-r="t" data-i="0" aria-selected="true">График</button><button type="button" class="wd-tab" role="tab" data-r="t" data-i="1" aria-selected="false">Расписание</button><button type="button" class="wd-tab" role="tab" data-r="t" data-i="2" aria-selected="false">Система</button></div><div class="wd-panel b-tb_ch" id="b_tb_ch" role="tabpanel" data-i="0"><div class="wd-field b-ch" id="b_ch"><div class="wd-field-head"><span>Температура</span><output data-r="v">--</output></div><canvas class="wd-chart" data-r="c" role="img" aria-label="Температура"></canvas></div></div><div class="wd-panel b-tb_sch" id="b_tb_sch" role="tabpanel" data-i="1" hidden><div class="wd-tablewrap b-tbl" id="b_tbl"><table class="wd-table"><thead><tr><th>Время</th><th>Уставка</th></tr></thead><tbody><tr><td>06:00</td><td>22 °C</td></tr><tr><td>09:00</td><td>18 °C</td></tr><tr><td>17:00</td><td>22 °C</td></tr><tr><td>23:00</td><td>19 °C</td></tr></tbody></table></div><ul class="wd-list b-tx" id="b_tx"><li data-c="0">Сейчас: -- °C</li><li data-c="1">Уставка: -- °C</li></ul></div><div class="wd-panel b-tb_inf" id="b_tb_inf" role="tabpanel" data-i="2" hidden><div class="wd-clock b-clk" id="b_clk"><div class="wd-label">Время работы</div><div class="wd-clock-t" data-r="t">--:--</div><div class="wd-label" data-r="d"></div></div></div></div></div></div></section>
</main>
<script src="app.js"></script>
</body>
</html>
